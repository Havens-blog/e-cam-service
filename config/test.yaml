# 安全配置
security:
  # 云账号 AccessKeySecret 加密密钥 (必须是 16/24/32 字节)
  encryption_key: "test-encryption-key-32bytes!!"

crypto_aes_key: "1234567890"

# 数据加密，根据模块划分
encryption:
  user:
    version: "V1"
    key: "1234567890"
  resource:
    version: "V1"
    key: "1234567890"
  runner:
    version: "V1"
    key: "1234567890"

ldap:
  url: "ldap://localhost:389"
  base_dn: "DC=example,DC=com"
  bind_dn: "CN=cn,OU=ou,DC=example,DC=com"
  bind_password: "1234567890"
  username_attribute: "sAMAccountName"
  mail_attribute: "mail"
  display_name_attribute: "displayName"
  title_attribute: "title"
  group_name_attribute: "cn"
  user_filter: "(&(sAMAccountName={input})(!(UserAccountControl=514)))"
  group_filter: "(|(member={dn}))"

session:
  session_encrypted_key: "haven-dev-session-shared-key-2026-10-10-A"
  cookie:
    domain: ".example.com"
    name: "ecmdb-token-key"

redis:
  addr: "localhost:6379"
  password: "123456"
  db: 0

casbin:
  redis:
    addr: "localhost:6379"
    db: 1
    password: ""

mongodb:
  dsn: mongodb://118.145.73.93:27017/ecam?authSource=admin
  db: ecam
  username: ecmdb
  password: 123456

cronjob:
  enabled: true

# 认证中间件配置
auth:
  whitelist:
    - "/api/v1/cam/health"
    - "/swagger/*"
    - "/docs"
    - "/api/v1/cam/topology/declarations"  # APM 推送脚本内部调用，无需用户 session

# CORS：本地联调全放行（生产严禁 allow_all）
cors:
  allow_all: true

# eiam 远程鉴权（细粒度授权 CheckAPI，取代原 ecmdb 策略死链路）
# 上线顺序：先 sync_enabled=true 让端点资产进 eiam 并配置角色权限，
# 再 enabled=true 切强制（未授权请求 403，未打标路由不受影响）。
# 注意：本地联调需与 eiam 使用同一 Redis session 库（见 eiam config）。
policy:
  enabled: false
  sync_enabled: false
  auth_url: http://127.0.0.1:9000        # eiam HTTP
  discovery_url: http://127.0.0.1:9000   # 资产上报，SDK 自动补 /api/v1/discovery/sync

# eiam 租户治理配置查询（创建云账号时强制校验配额 R2.4 / 云厂商白名单 R7）
# 数据源为 eiam 租户详情 GET /api/s2s/tenant/detail/:id（独立 S2S 路由组）；base_url 留空回退 policy.auth_url。
# 鉴权：经 ServiceTokenProvider 用 client_credentials 换取携带租户上下文的 S2S 令牌，
# eiam 侧需注册同 client_id 的机密应用并声明 allowed_tenants（含 -1 全租户通配）。
# 换取/验签失败 → CreateAccount fail-closed 拒绝。
eiam:
  base_url: ""
  token_url: ""
  client_id: ""
  client_secret: ""
  # 服务间鉴权（入站验签）：eiam OIDC 签名密钥对应的 RSA 公钥 PEM，
  # 用于 /api/s2s 路由组验 client_credentials RS256 令牌（OpsAgent RCA → 日志查询）。
  # 由 eiam keyManager 导出（ExportPublicKeyPEM）；未配置则服务间调用 fail-closed。
  public_key: ""
