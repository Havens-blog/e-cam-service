# 安全配置
security:
  # 云账号 AccessKeySecret 加密密钥 (必须是 16/24/32 字节)
  encryption_key: "test-encryption-key-32bytes!!"

crypto_aes_key: "1234567890"

# 数据加密，根据模块划分
encryption:
  user:
    version: "V1"
    key: "1234567890"
  resource:
    version: "V1"
    key: "1234567890"
  runner:
    version: "V1"
    key: "1234567890"

ldap:
  url: "ldap://localhost:389"
  base_dn: "DC=example,DC=com"
  bind_dn: "CN=cn,OU=ou,DC=example,DC=com"
  bind_password: "1234567890"
  username_attribute: "sAMAccountName"
  mail_attribute: "mail"
  display_name_attribute: "displayName"
  title_attribute: "title"
  group_name_attribute: "cn"
  user_filter: "(&(sAMAccountName={input})(!(UserAccountControl=514)))"
  group_filter: "(|(member={dn}))"

session:
  session_encrypted_key: "1234567890Key"
  cookie:
    domain: ".example.com"
    name: "ecmdb-token-key"

redis:
  addr: "localhost:6379"
  password: "123456"
  db: 0

casbin:
  redis:
    addr: "localhost:6379"
    db: 1
    password: ""

mongodb:
  dsn: mongodb://118.145.73.93:27017/ecam?authSource=admin
  db: ecam
  username: ecmdb
  password: 123456

cronjob:
  enabled: true

# 认证中间件配置
auth:
  whitelist:
    - "/api/v1/cam/health"
    - "/swagger/*"
    - "/docs"
    - "/api/v1/cam/topology/declarations"  # APM 推送脚本内部调用，无需用户 session

# CORS：本地联调全放行（生产严禁 allow_all）
cors:
  allow_all: true

# eiam 远程鉴权（细粒度授权 CheckAPI，取代原 ecmdb 策略死链路）
# 上线顺序：先 sync_enabled=true 让端点资产进 eiam 并配置角色权限，
# 再 enabled=true 切强制（未授权请求 403，未打标路由不受影响）。
# 注意：本地联调需与 eiam 使用同一 Redis session 库（见 eiam config）。
policy:
  enabled: false
  sync_enabled: false
  auth_url: http://127.0.0.1:9000        # eiam HTTP
  discovery_url: http://127.0.0.1:9000   # 资产上报，SDK 自动补 /api/v1/discovery/sync
