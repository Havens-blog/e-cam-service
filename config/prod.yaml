e-cam-service:
  port: "8001"

# 安全配置
security:
  # 云账号 AccessKeySecret 加密密钥 (必须是 16/24/32 字节)
  # 生产环境建议使用环境变量: CAM_ENCRYPTION_KEY
  encryption_key: "48CpLbg+M(HhZa~R"

# 日志配置
logger:
  default:
    level: "info"

crypto_aes_key: "1234567890"

# 数据加密，根据模块划分
encryption:
  user:
    version: "V1"
    key: "1234567890"
  resource:
    version: "V1"
    key: "1234567890"
  runner:
    version: "V1"
    key: "1234567890"

ldap:
  url: "ldap://106.52.187.69:389"
  base_dn: "DC=example,DC=com"
  bind_dn: "CN=cn,OU=ou,DC=example,DC=com"
  bind_password: "1234567890"
  username_attribute: "sAMAccountName"
  mail_attribute: "mail"
  display_name_attribute: "displayName"
  title_attribute: "title"
  group_name_attribute: "cn"
  user_filter: "(&(sAMAccountName={input})(!(UserAccountControl=514)))"
  group_filter: "(|(member={dn}))"

session:
  session_encrypted_key: "1234567890Key"
  cookie:
    domain: ".example.com"
    name: "ecmdb-token-key"

# db 必须与 eiam 保持一致（统一为 1）。
# eiam 通过 ginRedis.NewSessionProvider 往该 db 写 session，
# 本服务从同一 db 读取校验；不一致会导致"会话无效或已过期"。
# 注意：本服务 session 与成本分析缓存共用这一个 Redis 客户端。
redis:
  addr: "106.52.187.69:6379"
  password: "1234567890"
  db: 1

casbin:
  redis:
    addr: "106.52.187.69:6379"
    db: 2
    password: ""

mongodb:
  dsn: mongodb://106.52.187.69:27017/ecam?authSource=admin
  db: ecam
  username: ecmdb
  password: 123456

cronjob:
  enabled: true

# 认证中间件配置
auth:
  whitelist:
    - "/api/v1/cam/health"
    - "/swagger/*"
    - "/docs"
    - "/api/v1/cam/topology/declarations"  # APM 推送脚本内部调用，无需用户 session


# CORS 白名单：仅精确匹配的来源放行；*.example.com 形式通配子域。
# 未配置时回退代码内置的本地开发默认值（localhost:8888/5173/3333）。
# cors:
#   allowed_origins:
#     - "https://cam.example.com"

# eiam 远程鉴权（细粒度授权 CheckAPI，取代原 ecmdb 策略死链路）
# 上线顺序：先 sync_enabled=true 让端点资产进 eiam 并配置角色权限，
# 再 enabled=true 切强制（未授权请求 403，未打标路由不受影响）。
policy:
  enabled: false
  sync_enabled: false
  auth_url: http://106.52.187.69:9000
  discovery_url: http://106.52.187.69:9000
