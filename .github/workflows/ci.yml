name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  GO_VERSION: '1.25.5'
  PROJECT_NAME: e-cam-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # 需要完整历史：golangci-lint 的 --new-from-rev 要能与基线 commit 做 diff。
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Install tools
      run: |
        go install github.com/google/wire/cmd/wire@latest
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Generate Wire code
      run: |
        wire gen ./ioc
        wire gen ./internal/endpoint

    - name: Run tests
      env:
        # 集成测试通过该环境变量获取 Mongo DSN。
        # services.mongodb 启用了 root 认证（admin/password），而测试代码缺省回退到
        # 「无凭据的 127.0.0.1:27017」；该连接能 ping 通，因此不会触发 t.Skipf，
        # 但执行到 createIndexes 时会报 (Unauthorized)，
        # 导致大量 DAO 集成测试失败（change_order_audit / cert / changeorder 等）。
        CERT_TEST_MONGODB_DSN: mongodb://admin:password@127.0.0.1:27017/?authSource=admin
      run: |
        go test -v -race -coverprofile=coverage.out ./...

    - name: Generate coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Run golangci-lint
      env:
        # 只对「相对基线新增/修改」的代码报错，存量历史债务不阻塞 CI。
        #
        # 背景：本仓库 lint 步骤此前因 run.timeout 5m 不足而一直超时（exit code 4），
        # 从未真正跑完；修好超时后一次性暴露 572 条历史问题（22 类 linter）。
        # 直接全量修复会跨 20+ 文件、与并行开发分支大量冲突。
        #
        # 采用 golangci-lint 官方的增量检查模式：
        #   - 存量债务：不阻塞（基线之前的问题不报）
        #   - 新增代码：仍须干净（门禁不弱化，也不使用 continue-on-error）
        BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      run: |
        if git rev-parse --verify "$BASE_REV" >/dev/null 2>&1; then
          echo "增量检查基线: $BASE_REV"
          golangci-lint run --new-from-rev="$BASE_REV" ./...
        else
          echo "基线 $BASE_REV 不可用，回退到全量检查"
          golangci-lint run ./...
        fi

    - name: Run go vet
      run: |
        go vet ./...

    - name: Check domain boundaries (depcheck)
      run: |
        go run ./scripts/depcheck

    - name: Check cert-server deployability closure (deploycheck)
      run: |
        go run ./scripts/deploycheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        go install github.com/google/wire/cmd/wire@latest

    - name: Generate Wire code
      run: |
        wire gen ./ioc
        wire gen ./internal/endpoint

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        if [[ "$VERSION" == "refs/heads/"* ]]; then
          VERSION=${GITHUB_SHA::8}
        fi
        
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        COMMIT_HASH=${GITHUB_SHA::8}
        
        LDFLAGS="-ldflags -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.CommitHash=${COMMIT_HASH}"
        
        OUTPUT_NAME=${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME=${OUTPUT_NAME}.exe
        fi
        
        go build ${LDFLAGS} -o ${OUTPUT_NAME} .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
        path: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create release assets
      run: |
        mkdir -p release
        for dir in ./artifacts/*/; do
          if [ -d "$dir" ]; then
            cp -r "$dir"* release/
          fi
        done
        ls -la release/

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max