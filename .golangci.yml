# golangci-lint 配置文件
# 代码质量检查工具配置

run:
  # 5m 不足以完成包加载。CI 实测（run 41030420479）报：
  #   level=error msg="Running error: context loading failed:
  #     failed to load with go/packages: context deadline exceeded"
  #   level=error msg="Timeout exceeded: try increasing it by passing --timeout option"
  #   ##[error]Process completed with exit code 4
  # 该步骤在约 5 分钟处被杀，导致所有 PR（含 main）恒红。
  # 提高到 15m 以覆盖包加载 + 实际检查所需时间。
  timeout: 15m
  issues-exit-code: 1
  tests: true
  skip-dirs:
    - vendor
    - logs
    - build
    - dist
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"
    - "wire_gen\\.go$"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  govet:
    check-shadowing: true
  golint:
    min-confidence: 0
  gocyclo:
    min-complexity: 15
  maligned:
    suggest-new: true
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  lll:
    line-length: 140
  goimports:
    local-prefixes: github.com/Havens-blog/e-cam-service
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc

linters:
  enable:
    - bodyclose
    - deadcode
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exportloopref
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - golint
    - gomnd
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - interfacer
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - scopelint
    - staticcheck
    - structcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - varcheck
    - whitespace

  disable:
    - maligned
    - prealloc

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gomnd
        - goconst
        - dupl
    - path: cmd/
      linters:
        - gochecknoinits
    - path: main\.go
      linters:
        - gochecknoinits

  exclude-use-default: false
  exclude:
    # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
    - Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
    
  max-issues-per-linter: 50
  max-same-issues: 3